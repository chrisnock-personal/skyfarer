{% extends "auth_base.html" %}
{% block title %}Sign in · Skyfarer{% endblock %}
{% block card %}
<form class="card" method="post" action="{{ url_for('admin.login') }}">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next }}">
  <div>
    <h1>Sign in</h1>
    <p>Cloud status for your regions.</p>
  </div>
  {% if error %}<div class="flash bad" role="alert">{{ error }}</div>{% endif %}
  <div class="field">
    <label for="email">Email</label>
    <input class="input" id="email" name="email" type="email" autocomplete="username" value="{{ email }}" required autofocus>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button type="submit" class="btn primary">Sign in</button>
  <p class="hint">Forgotten your password? An admin can give you a new setup link.</p>
</form>
{% endblock %}
