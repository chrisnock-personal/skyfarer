[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyfarer-cli"
version = "1.0.0"
description = "Command-line client for the Skyfarer API"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skyfarer = "cli:main"
skyfarer-mcp = "skyfarer_mcp:main"

[tool.setuptools]
py-modules = ["cli", "skyfarer_mcp"]
